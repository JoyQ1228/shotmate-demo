const $=s=>document.querySelector(s);let saved;try{saved=JSON.parse(localStorage.getItem('shotmate-v1'))}catch{}let s=saved||{page:'home',scene:'出游散步',intent:'想把周末出门的松弛感拍下来，有风、有阳光，也有一些不起眼的小美好。',style:'治愈松弛',duration:30,shots:[],clips:[],title:'把平凡的一天，拍成喜欢的样子',adapted:false};let current=0,recording=false,timer,elapsed=0,playing=false,playTimer;

function toast(t){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function done(i){return s.clips.some(c=>c.id===i)}

async function polishIntent(button){if(polishBusy)return;let input=$('#intent'),original=input.value.trim();if(!original){toast('先写一句想法吧');input.focus();return}polishBusy=true;button.disabled=true;button.classList.add('working');let pageInput=input;await new Promise(resolve=>setTimeout(resolve,650));if(s.page==='create'&&$('#intent')===pageInput){polishOriginal=original;input.value=original.replace(/[。… .]+$/,'')+'。以'+s.style+'的节奏，先交代'+s.scene+'的环境，再捕捉细节与自然情绪，最后用一个留白镜头收尾。';s.intent=input.value;$('#polishUndo').hidden=false;save();toast('已润色 · 模拟 AI')}polishBusy=false;button.disabled=false;button.classList.remove('working')}
function undoPolish(){$('#intent').value=polishOriginal;s.intent=polishOriginal;$('#polishUndo').hidden=true;save()}
function setDuration(value){let n=Number(value);if(!Number.isFinite(n)||n<5||n>300){toast('时长可设为 5–300 秒');n=Math.min(300,Math.max(5,Number.isFinite(n)&&n?n:30))}s.duration=Math.round(n);$('#duration').value=s.duration;save()}
function stepDuration(delta){setDuration(Number($('#duration').value||30)+delta)}
function toggleDuration(button){let menu=button.nextElementSibling;menu.hidden=!menu.hidden;button.setAttribute('aria-expanded',String(!menu.hidden))}
function chooseDuration(value,button){s.duration=value;$('#duration').value=value;$('#durationLabel').textContent=value+' 秒';let menu=button.parentElement;for(let child of menu.children)child.classList.toggle('chosen',child===button);menu.hidden=true;menu.previousElementSibling.setAttribute('aria-expanded','false');save()}
function chooseMood(value,button){s.style=value;s.intent=$('#intent').value;let list=button.parentElement;for(let child of list.children){child.classList.toggle('selected',child===button);child.setAttribute('aria-pressed',child===button?'true':'false')}save()}
let generationBusy=false;
async function requestGenerate(button){if(generationBusy)return;if(!$('#intent').value.trim()){toast('写一句想记录的内容吧');$('#intent').focus();return}generationBusy=true;button.disabled=true;button.textContent='正在规划镜头…';await new Promise(resolve=>setTimeout(resolve,700));if(s.page!=='create'){generationBusy=false;return}try{if(!['出游散步','咖啡探店','朋友聚会','日常记录','海边度假','城市漫游','美食记录','运动户外'].includes(s.scene))throw Error('scene');generate()}catch{button.disabled=false;button.textContent='重试生成';toast('生成未完成，请重试')}finally{generationBusy=false}}
function generate(){let val=$('#intent').value.trim();if(!val){toast('先写一句你想记录的内容吧');return}s.projectId='p'+Date.now()+Math.random().toString(36).slice(2,6);draft=null;s.intent=val;s.duration=Math.min(300,Math.max(5,Math.round(+$('#duration').value||30)));s.title=s.scene+' · '+s.style+'的一天';let names={'出游散步':['走进今天的风景','脚步与路边的小美好','让风进入画面','留一个你的背影','和今天温柔告别'],'咖啡探店':['推门遇见一家店','咖啡落入杯中的瞬间','窗边的光与影','第一口的满足','带走一点好心情'],'朋友聚会':['奔向相聚的地点','桌上的小小仪式感','捕捉一次自然的笑','一起走过这一段','用挥手结束今天'],'海边度假':['第一次看见海','脚边的浪花','海风吹过发梢','向海奔跑的背影','把日落留在最后'],'城市漫游':['走进一条陌生街道','街角的招牌与纹理','穿过路口的光','在人群里记录你','城市灯光亮起'],'美食记录':['今天吃点什么','食材与酱汁的细节','热气升起的瞬间','第一口的真实反应','空盘与满足的告别'],'运动户外':['出发前的全景','装备与系鞋带','行进中的节奏','到达后的笑容','回望走过的路'],'日常记录':['今天从这里开始','发现一个生活细节','光照进来的时候','记录专注的自己','给今天一个句号']}[s.scene];s.shots=names.map((title,id)=>({id,title,sec:Math.floor(s.duration/5)+(id<s.duration%5?1:0),type:['远景 · 建立环境','特写 · 丰富细节','中景 · 氛围过渡','中景 · 人物情绪','远景 · 情绪收尾'][id],tip:['手机放在胸口高度，缓慢向前走，先稳住再移动。','靠近一个有趣的细节，锁定主体，停留两秒再轻推。','让光线从侧面进入，缓慢横移，给画面留一点呼吸。','让人物自然行动，不用看镜头，保持安全的拍摄距离。','固定机位，让主体缓缓离开，结尾多留两秒。'][id]}));s.clips=[];s.adapted=false;go('plan')}
function plan(){if(!s.shots.length)return `<div class="empty"><h2>先给故事一个起点</h2><p class="muted">告诉搭子你的创作想法，生成分镜任务。</p><button class="primary" onclick="go('create')">开始创作</button></div>`;return `<div class="plan-heading"><h1>拍摄计划</h1><div class="plan-tools"><small>已完成 ${s.clips.length} / ${s.shots.length}</small>${selected().length?'<button class="mini-film" onclick="go(\'preview\')">预览成片</button>':''}</div></div>${[...s.shots].sort((a,b)=>Number(done(a.id))-Number(done(b.id))).map(x=>{let i=s.shots.findIndex(shot=>shot.id===x.id);return `<div class="card"><div class="row"><span class="num">${done(x.id)?'✓':String(i+1).padStart(2,'0')}</span><small>${x.type} · ${x.sec} 秒${x.adjusted?' · 已更新':''}</small></div><button class="shot-thumb shot-preview" ${done(x.id)?`onclick="openClip(${x.id},'plan')" aria-label="播放已拍镜头"`:'disabled aria-label="待拍摄分镜"'} style="background-image:url('assets/${shotPhoto(x)}.jpg')">${done(x.id)?'<i class="shot-play-symbol">▶</i>':''}</button><h3>${esc(x.title)}</h3><p>${esc(x.tip.split("，").slice(0,2).join("，"))}</p><div class="actions"><button class="edit-icon" onclick="edit(${i})" aria-label="编辑分镜" title="编辑分镜"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l4-1 12-12a2.1 2.1 0 0 0-5-3L3 16l-1 5z"/></svg></button>${done(x.id)?`<button class="include-clip" onclick="toggleClip(${x.id})" aria-pressed="${s.clips.find(c=>c.id===x.id).included}">${s.clips.find(c=>c.id===x.id).included?'已入成片':'加入成片'}</button>`:''}<button class="primary" style="padding:11px" onclick="current=${i};go('camera')">${done(x.id)?'重拍':'去拍摄'}</button></div></div>`}).join('')}`}
function edit(i){let x=s.shots[i];$('#main').innerHTML=`<div class="plan-heading"><h1>编辑分镜</h1></div><label>镜头名称</label><input id="et" value="${esc(x.title)}"><label>拍摄指引</label><textarea id="ep">${esc(x.tip)}</textarea><label>镜头时长（1–300 秒）</label><input id="es" type="number" min="1" max="300" value="${x.sec}"><div class="actions"><button class="secondary" onclick="render()">取消</button><button class="primary" onclick="commitEdit(${i})">保存修改</button></div>`}function commitEdit(i){let title=$('#et').value.trim(),tip=$('#ep').value.trim(),sec=+$('#es').value;if(!title||!tip||!Number.isFinite(sec)||sec<1||sec>300){toast('请填写名称、指引及 1–300 秒时长');return}Object.assign(s.shots[i],{title,tip,sec});save();render()}function move(i){[s.shots[i-1],s.shots[i]]=[s.shots[i],s.shots[i-1]];save();render()}function adapt(){let pending=s.shots.filter(x=>!done(x.id));if(!pending.length||!s.clips.length)return;let last=s.clips[s.clips.length-1],source=s.shots.find(x=>x.id===last.id);if(last.sec<Math.min(3,source.sec)&&!pending[0].adjusted){pending[0].tip='上一镜头偏短，保持画面稳定，拍足 '+pending[0].sec+' 秒，给剪辑留出空间。';pending[0].adjusted=true;s.adapted=true}save();render()}
function camera(){let x=s.shots[current];if(!x)return plan();return `<div class="camera-layout"><div class="camera-top"><button class="camera-back" onclick="leaveCamera()" aria-label="返回分镜"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><span>${current+1} / ${s.shots.length}</span><span class="camera-time" id="clock">00:00</span></div><h2 class="camera-title">${esc(x.title)}</h2><div class="scene camera-view" style="background-image:url('assets/${shotPhoto(x)}.jpg')"><div class="grid"></div><div class="camera-guide"><span>${esc(x.tip.split('，').slice(0,2).join('，'))}</span></div></div><div class="camera-controls"><span class="camera-side">${x.sec}s</span><button class="record" id="rec" aria-label="开始拍摄演示" onclick="record()"></button><span class="camera-side">${current+1}/${s.shots.length}</span></div><span id="recLabel" hidden></span></div>`}function leaveCamera(){clearInterval(timer);recording=false;go('plan')}function record(){if(recording){finish();return}recording=true;elapsed=0;$('#rec').classList.add('is-recording');$('#rec').setAttribute('aria-label','结束拍摄演示');$('#rec').setAttribute('aria-pressed','true');$('#clock').classList.add('is-recording');$('#recLabel').textContent='正在模拟拍摄 · 点击结束';timer=setInterval(()=>{elapsed++;$('#clock').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0');if(elapsed>=s.shots[current].sec)finish()},1000)}let reviewTimer=null,reviewTime=0,reviewPlaying=false;
function reviewPhoto(){return shotPhoto(s.shots[current])}function unusedReviewPhoto(){return {'出游散步':'walk','咖啡探店':'coffee','朋友聚会':'friends-new','日常记录':'daily','海边度假':'beach','城市漫游':'city','美食记录':'food','运动户外':'outdoor'}[s.scene]||'walk'}
function stopReview(){clearInterval(reviewTimer);reviewPlaying=false}
function toggleReview(){let panel=$('#reviewPlayer');if(reviewPlaying){stopReview();panel.classList.remove('playing');$('#reviewPlay').textContent='▶';$('#reviewPlay').setAttribute('aria-label','播放');return}if(reviewTime>=Math.max(1,elapsed))reviewTime=0;reviewPlaying=true;panel.classList.add('playing');$('#reviewPlay').textContent='Ⅱ';$('#reviewPlay').setAttribute('aria-label','暂停');reviewTimer=setInterval(()=>{reviewTime=Math.min(reviewTime+.1,Math.max(1,elapsed));updateReview();if(reviewTime>=Math.max(1,elapsed)){stopReview();panel.classList.remove('playing');$('#reviewPlay').textContent='▶';$('#reviewPlay').setAttribute('aria-label','重新播放')}},100)}
function updateReview(){$('#reviewSeek').value=reviewTime;$('#reviewTime').textContent=Math.floor(reviewTime)+' / '+Math.max(1,elapsed)+' 秒';$('#reviewPhoto').style.transform='scale('+(1+reviewTime/Math.max(1,elapsed)*.07)+')'}
function finish(){clearInterval(timer);recording=false;stopReview();reviewTime=0;let x=s.shots[current];$('#main').className='review-main';$('#main').innerHTML=`<div class="review-layout"><div class="feedback-top"><button class="camera-back" onclick="stopReview();go('plan')" aria-label="返回拍摄计划"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><h2>${esc(x.title)}</h2></div><div class="review-player" id="reviewPlayer"><img id="reviewPhoto" src="assets/${reviewPhoto()}.jpg" alt="${esc(s.scene)}场景演示"><span class="review-demo">动态预览 · 模拟素材</span><button id="reviewPlay" class="review-play" onclick="toggleReview()" aria-label="播放">▶</button><div class="review-transport"><span id="reviewTime">0 / ${Math.max(1,elapsed)} 秒</span><input type="range" id="reviewSeek" min="0" max="${Math.max(1,elapsed)}" step="0.1" value="0" aria-label="播放进度" oninput="reviewTime=+this.value;updateReview()"></div></div><div class="actions review-actions"><button class="secondary" onclick="stopReview();go('camera')">重拍</button><button class="primary" onclick="stopReview();keep()">保留</button></div></div>`;$('#main').scrollTop=0}
function keep(){let x=s.shots[current],old=s.clips.find(c=>c.id===x.id);s.clips=s.clips.filter(c=>c.id!==x.id);s.clips.push({id:x.id,title:x.title,sec:Math.max(1,elapsed),included:old?old.included:true});save();go('plan');if(s.shots.some(x=>!done(x.id))){adapt();toast(s.shots.some(x=>!done(x.id)&&x.adjusted)?'已保留，后续拍法已更新':'已保留，继续下一个镜头')}else{toast('全部镜头已完成，可以预览成片了')}}
function library(){return `<div class="plan-heading"><h1>素材</h1>${selected().length?'<button class="mini-film" onclick="go(\'preview\')">预览成片</button>':''}</div>${s.shots.filter(x=>done(x.id)).map(x=>{let c=s.clips.find(c=>c.id===x.id);return `<div class="card"><div class="row"><button class="num clip-play" aria-label="播放素材" onclick="openClip(${x.id})">▷</button><h3>${esc(x.title)}</h3><small>${c.sec}s</small></div><p>虚构插画素材 · ${c.included?'已加入成片':'已排除'}</p><div class="actions"><button class="secondary" onclick="s.clips.find(c=>c.id===${x.id}).included=!s.clips.find(c=>c.id===${x.id}).included;save();render()">${c.included?'从成片排除':'加入成片'}</button><button class="secondary" onclick="current=s.shots.findIndex(x=>x.id===${x.id});go('camera')">重拍</button></div></div>`}).join('')||'<div class="empty">还没有素材，去完成第一个镜头吧。</div>'}<button class="primary" onclick="go('preview')">查看成片</button>`}
function openClip(id,origin='plan'){let clip=s.clips.find(c=>c.id===id);current=s.shots.findIndex(x=>x.id===id);if(!clip||current<0)return;elapsed=clip.sec;go('camera');finish();let back=$('.review-layout .camera-back');back.setAttribute('onclick',"stopReview();go('"+origin+"')");back.setAttribute('aria-label',origin==='plan'?'返回拍摄计划':'返回素材');$('.review-actions').innerHTML=`<button class="secondary" onclick="stopReview();go('${origin}')">返回</button><button class="primary" onclick="stopReview();go('camera')">重拍</button>`;toggleReview()}
function toggleClip(id){let clip=s.clips.find(c=>c.id===id);if(clip){clip.included=!clip.included;save();render()}}function selected(){return s.shots.map(x=>s.clips.find(c=>c.id===x.id)).filter(c=>c&&c.included)}function preview(){let clips=selected();return clips.length?`<div class="film-layout"><div class="film-top"><h2>成片</h2><div class="film-top-actions"><button class="mini-film" onclick="publishFilm()">发布</button><button class="share-film" onclick="shareFilm()" aria-label="分享成片"><svg viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M6 11H4v10h16V11h-2"/></svg></button></div></div><div class="film-screen"><img id="filmImage" src="assets/${shotPhoto(s.shots.find(x=>x.id===clips[0].id))}.jpg" alt="${esc(s.scene)}模拟成片"><span class="film-watermark">DEMO</span><span class="film-counter" id="filmCounter">1 / ${clips.length}</span><button class="film-play" id="playButton" onclick="play()" aria-label="播放成片"><svg viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></svg></button></div></div>`:'<div class="empty"><h3>还没有可预览的镜头</h3><button class="primary" onclick="go(\'plan\')">去拍摄</button></div>'}
async function shareFilm(){let text=s.title+' · '+selected().reduce((n,c)=>n+c.sec,0)+' 秒';if(navigator.share){try{await navigator.share({title:s.title,text:text+'（ShotMate 模拟成片）'});return}catch(e){if(e.name==='AbortError')return}}let sheet=document.createElement('div');sheet.className='share-sheet';sheet.innerHTML='<div class="share-panel"><h3>分享成片</h3><p>模拟成片暂不支持导出视频</p><button class="primary" onclick="copyFilmTitle(this)">复制作品名称</button><button class="secondary" onclick="this.closest(\'.share-sheet\').remove()">取消</button></div>';sheet.onclick=e=>{if(e.target===sheet)sheet.remove()};document.body.append(sheet)}
async function copyFilmTitle(button){try{await navigator.clipboard.writeText(s.title);button.closest('.share-sheet').remove();toast('作品名称已复制')}catch{button.textContent=s.title;toast('可选中作品名称复制')}}
let filmTime=0;function play(){let button=$('#playButton'),img=$('#filmImage');if(playing){clearInterval(playTimer);playing=false;img.style.animationPlayState='paused';button.innerHTML='<svg viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></svg>';button.setAttribute('aria-label','播放成片');return}let clips=selected(),total=clips.reduce((a,c)=>a+c.sec,0);if(!clips.length)return;let t=filmTime>=total?0:filmTime,last=-1;playing=true;button.innerHTML='<svg viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>';button.setAttribute('aria-label','暂停成片');function tick(){let n=t,idx=0;while(idx<clips.length-1&&n>=clips[idx].sec){n-=clips[idx].sec;idx++}if(idx!==last){last=idx;img.src='assets/'+shotPhoto(s.shots.find(x=>x.id===clips[idx].id))+'.jpg';img.style.animation='none';void img.offsetWidth;img.style.objectPosition=['50% 50%','35% 45%','65% 55%','45% 65%','55% 35%'][idx%5];img.style.animation='filmDrift '+clips[idx].sec+'s ease-in-out both';$('#filmCounter').textContent=(idx+1)+' / '+clips.length}if(t>=total){clearInterval(playTimer);playing=false;img.style.animationPlayState='paused';button.innerHTML='<svg viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></svg>';button.setAttribute('aria-label','重新播放成片')}t+=.1;filmTime=t}tick();playTimer=setInterval(tick,100)}
function download(){let blob=new Blob([JSON.stringify({...s,simulation:'AI、相机、素材和成片均为模拟'},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ShotMate-创作清单.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}try{let likes=JSON.parse(localStorage.getItem('shotmate-likes'))||[];for(let p of featured){if(likes.some(l=>l.id===p.id&&l.liked)){p.liked=true;p.likes++}}}catch{}if(s.page==='create'&&s.projectId){let active=projects.find(p=>p.id===s.projectId);if(active)for(let key of projectFields)s[key]=JSON.parse(JSON.stringify(active[key]));s.page='home'}if(s.page==='communityDetail')s.page='community';if(s.page==='camera'||s.page==='library')s.page='plan';snapshot();save();render();
</script></html>
